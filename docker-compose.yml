services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/...
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Seeds the demo stock on first start only, so logged actions survive restarts.
  seed:
    build: .
    entrypoint: ["/seed", "-if-empty"]
    environment:
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
      DEALERSHIP_TIMEZONE: ${DEALERSHIP_TIMEZONE:-UTC}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please}
      DEALERSHIP_TIMEZONE: ${DEALERSHIP_TIMEZONE:-UTC}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      # Per client IP; set RATE_LIMIT_RPS=0 for load tests from one host.
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # Optional monitoring stack:
  #   OTLP_ENDPOINT=tempo:4317 docker compose --profile observability up -d
  # Grafana: http://localhost:3000
  # Stop it with: docker compose --profile observability down
  tempo:
    image: grafana/tempo:3.1.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.9
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  # Reads container logs through the Docker socket, and ships only the API's.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["observability"]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-kl_test}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  # Anonymous access is for local use, so the port only binds to localhost.
  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inventory-api.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  pgdata:
  prometheus-data:
  loki-data:
  alloy-data:
  tempo-data:
