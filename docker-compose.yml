services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/...
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Seeds the demo stock on first start only, so logged actions survive restarts.
  seed:
    build: .
    entrypoint: ["/seed", "-if-empty"]
    environment:
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
