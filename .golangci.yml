version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G115 # int conversions are range-checked by validation before narrowing
  exclusions:
    generated: lax
    presets: [comments, std-error-handling]
    paths:
      - db/gen
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/haotruong/inventory-dashboard]
